<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LocalServices</title>
    <!-- Corrected CSS paths -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.795.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.4/dist/amazon-cognito-identity.min.js"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">LocalServices</div>
            <h1>Welcome Back</h1>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-block" id="login-btn">
                    <span class="button-text">Login</span>
                    <span class="spinner hidden" id="spinner"></span>
                </button>
            </form>

            <div class="auth-links">
                <!-- Corrected paths -->
                <a href="register.html">Create account</a>
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <div class="social-login">
                <p class="divider">or continue with</p>
                <div class="social-buttons">
                    <!-- Corrected image paths -->
                    <button class="social-btn google" onclick="loginWithGoogle()">
                        <img src="../images/icons/google.svg" alt="Google"> Google
                    </button>
                    <button class="social-btn facebook" onclick="loginWithFacebook()">
                        <img src="../images/icons/facebook.svg" alt="Facebook"> Facebook
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Corrected JS path -->
    <script src="../js/auth.js"></script>
    <script>
        // Initialize AWS Cognito
        const poolData = {
            UserPoolId: 'us-east-1_YOUR_POOL_ID',
            ClientId: 'YOUR_CLIENT_ID'
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const spinner = document.getElementById('spinner');
            
            loginBtn.disabled = true;
            spinner.classList.remove('hidden');
            
            try {
                await loginUser(email, password);
                window.location.href = "../dashboard/"; // Corrected path
            } catch (error) {
                alert(error.message);
                console.error('Login error:', error);
            } finally {
                loginBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
