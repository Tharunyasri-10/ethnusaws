<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LocalServices</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.795.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.4/dist/amazon-cognito-identity.min.js"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">LocalServices</div>
            <h1>Create Account</h1>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                    <small class="hint">Minimum 8 characters with uppercase, number, and special character</small>
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+1 (555) 555-5555">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>
                
                <button type="submit" class="btn btn-block" id="register-btn">
                    <span class="button-text">Create Account</span>
                    <span class="spinner hidden" id="spinner"></span>
                </button>
            </form>

            <div class="auth-links">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        const poolData = {
            UserPoolId: 'us-east-1_YOUR_POOL_ID',
            ClientId: 'YOUR_CLIENT_ID'
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const phone = document.getElementById('phone').value;
            const registerBtn = document.getElementById('register-btn');
            const spinner = document.getElementById('spinner');
            
            if (password !== confirmPassword) {
                alert("Passwords don't match!");
                return;
            }
            
            registerBtn.disabled = true;
            spinner.classList.remove('hidden');
            
            try {
                await registerUser(email, password, phone);
                window.location.href = `confirm-account.html?email=${encodeURIComponent(email)}`;
            } catch (error) {
                alert(error.message);
                console.error('Registration error:', error);
            } finally {
                registerBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
